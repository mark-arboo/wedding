<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
   
    <title>Wedding</title>
    
    <!-- Collegamento al Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/img/logo.png">

    <!-- Icona per iOS (Safari non legge bene il manifest per l'icona home) -->
    <link rel="apple-touch-icon" href="img/logo.png">

    <!-- Colore della barra di stato su mobile -->
    <meta name="theme-color" content="#ffffff">

    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <body>
    <script>
      // per produzione i log sono disabilitati
      const isProduction = window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1';
      console.log("isProduction:", isProduction);

      if (isProduction) {
        console.log = () => {};
        console.warn = () => {};
        console.info = () => {};
        console.error = () => {};
      }
    </script>
    <script src="./script/gdrive.js"></script>
    <script src="./script/core.js"></script>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="app-screen">
      <div class="login-hero">
        <div class="login-overlay">
          <div class="login-heading">
            <h1 class="login-title">Matrimonio </h1>
            <p class="login-subtitle">Daniela &amp; Marco</p>
          </div>
          <div class="login-form">
            <label for="login-name" class="login-label">Condividi le tue foto e video con noi per questo giorno speciale! </label>
            <input id="login-name" class="login-input" type="text" placeholder="Il tuo nome" autocomplete="name" maxlength="40">
            <button id="login-submit" class="login-button" type="button">Avanti <i class="fa fa-arrow-right" aria-hidden="true"></i></button>
          </div>
        </div>
      </div>
    </div> 

    <!-- GRID SCREEN -->
    <div id="grid-screen" class="app-screen">

      <!-- Indicatore visivo che appare durante il trascinamento -->
      <div id="ptr-indicator" class="ptr-indicator">
        <span id="ptr-text">Scorri per aggiornare</span>
      </div>

      <div class="grid-layout">
        <div id="slideshow" aria-label="Slideshow foto casuali">
          <img id="slideshow-image" src="" alt="Slideshow matrimonio" loading="eager" />
          <div class="login-heading slideshow-heading" aria-hidden="true">
            <h1 class="login-title">Matrimonio </h1>
            <p class="login-subtitle">Daniela &amp; Marco</p>
          </div>
          <div id="signout" onclick="showLoginPanel()">
            <i class="fa fa-arrow-left" aria-hidden="true"></i>
          </div>
          <button id="slideshow-uploadBtn" onclick="">
            <i class="fa fa-plus-circle" aria-hidden="true"></i> Aggiungi all'album
          </button>
        </div>

        <div class="instagram-grid" id="feed">
          <div class="gallery-item">
            <img src="img/no-image.jpg" alt="image" loading="lazy" />

            <div class="overlay">

                  128
                </span>
              </div>
            </div>

        </div>

    </div> 


    <div id="feed-screen" class="app-screen">

    </div>
