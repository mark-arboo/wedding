<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
   
    <title>Wedding</title>
    
    <!-- Collegamento al Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Icona per iOS (Safari non legge bene il manifest per l'icona home) -->
    <link rel="apple-touch-icon" href="logo.png">

    <!-- Colore della barra di stato su mobile -->
    <meta name="theme-color" content="#000000">

    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  </head>
  <body>

    <script src="./script/core.js"></script>


    <header>
      <h1>InstaDrive</h1>
    </header>

    <!-- Form di Upload -->
    <div class="upload-card">
      <h3>Nuovo Post</h3>
      <input type="file" id="fileInput" accept="image/*,video/*" />
      <textarea id="captionInput" placeholder="Scrivi una descrizione..."></textarea>
      <button id="uploadBtn" onclick="uploadMedia()">Condividi</button>
      <div id="uploadStatus" style="font-size: 12px; text-align: center;"></div>
    </div>

    <!-- Feed della Galleria -->
    <div class="feed" id="feed">
      <div class="loading-spinner">Caricamento galleria...</div>
    </div>


  </body>
</html>
